<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tasks list</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header">
      <section class="container">
        <h1>Tasks Tracker</h1>
        <nav>
          <ul>
            <li><a href="#">Tasks</a></li>
            <li><a href="#">Board</a></li>
            <li><a href="#">Roadmap</a></li>
          </ul>
        </nav>
      </section>
    </header>
    <main class="container">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Target date.</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>study ts</td>
            <td><span class="chip status-done">Done</span></td>
            <td><span class="chip priority-high">HIGH</span></td>
            <td>2026-09-05</td>
          </tr>
          <tr>
            <td>study react</td>
            <td><span class="chip status-in-progress">In Progress</span></td>
            <td><span class="chip priority-medium">MEDIUM</span></td>
            <td>2026-09-09</td>
          </tr>
          <tr>
            <td>study REST</td>
            <td><span class="chip status-backlog">BackLog</span></td>
            <td><span class="chip priority-low">LOW</span></td>
            <td>2026-10-01</td>
          </tr>
          <tr>
            <td>study sql</td>
            <td><span class="chip status-backlog">BackLog</span></td>
            <td><span class="chip priority-high">HIGH</span></td>
            <td>2026-10-05</td>
          </tr>
          <tr>
            <td>study spring</td>
            <td><span class="chip status-done">Done</span></td>
            <td><span class="chip priority-low">LOW</span></td>
            <td>2026-09-06</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
